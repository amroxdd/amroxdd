<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow - Order Confirmation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main>
    <h2>Thank you for your order!</h2>

    <section id="confirmation" class="summary">
      <p>Order number: <strong id="order-number">...</strong></p>
      <p>Status: <strong id="order-status">...</strong></p>

      <h3>Items</h3>
      <div id="items"></div>

      <h3>Total: AED <span id="order-total">0.00</span></h3>
    </section>

    <p><a class="btn" href="products.html">Continue shopping</a></p>
  </main>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>

</body>
</html>
