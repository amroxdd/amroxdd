<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow - Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main>
    <h2>Checkout</h2>

    <section class="summary">
      <h3>Your order</h3>
      <div id="checkout-items"></div>
      <h3>Total: AED <span id="checkout-total">0.00</span></h3>
    </section>

    <form id="checkout-form" class="form">
      <h3>Shipping information</h3>

      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="address">Address</label>
      <input type="text" id="address" required>

      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="+971 50 123 4567" required>

      <button type="submit" id="place-order-btn" class="btn">Place Order</button>
    </form>
  </main>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>

</body>
</html>
